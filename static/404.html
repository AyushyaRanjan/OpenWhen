<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Open When</title>
    <meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221a17" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        --bg: #fbf6f1;
        --surface: #ffffff;
        --text: #3b2b26;
        --muted: #7d6a62;
        --accent: #c9705a;
        --border: #ecdcd2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #221a17;
          --surface: #2c221e;
          --text: #f4eae4;
          --muted: #c3aca2;
          --accent: #e7a38c;
          --border: #3d2f29;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top))
          max(22px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(22px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.55;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 22px;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>This page isn't here</h1>
      <p>
        The link may be old, or the page may have moved. Nothing is broken on
        your side.
      </p>
      <a href="/">Take me home</a>
    </main>
  </body>
</html>
